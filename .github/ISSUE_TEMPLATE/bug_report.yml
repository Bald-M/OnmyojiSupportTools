name: Bug 报告
description: 报告可复现的桌面应用、ADB、设备或坐标问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请搜索已有 Issue，并对截图、日志、IP、设备序列号和用户名路径进行脱敏。

  - type: input
    id: app-version
    attributes:
      label: 应用版本
      placeholder: 例如 0.1.0 或 CI 构建编号
    validations:
      required: true

  - type: dropdown
    id: windows-version
    attributes:
      label: Windows 版本
      options:
        - Windows 10 22H2 x64
        - Windows 11 x64
        - Windows 11 ARM64（实验性）
        - 其他（当前不受支持）
    validations:
      required: true

  - type: dropdown
    id: emulator
    attributes:
      label: 模拟器
      options:
        - MuMu 模拟器 12
        - 雷电模拟器 9
        - 其他（当前不受支持）
    validations:
      required: true

  - type: input
    id: adb
    attributes:
      label: ADB 来源与版本
      description: 不要粘贴包含用户名的完整本地路径。
      placeholder: 例如 MuMu 12 自带，Version 35.0.2
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动……
        2. 选择……
        3. 点击……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志或截图
      description: 可拖入图片或粘贴少量相关日志；不要上传完整个人配置。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索已有 Issue，并确认这不是重复报告。
          required: true
        - label: 我已移除设备序列号、IP、账户、令牌和用户名路径等敏感信息。
          required: true
