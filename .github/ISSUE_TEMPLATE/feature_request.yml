name: 功能建议
description: 提议一个符合当前桌面产品边界的改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。当前版本聚焦 Windows 单活动设备、手动截图与显式点击；较大的识别、任务或调度能力需要先讨论领域边界。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户场景和当前阻碍，不要只写解决方案名称。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议行为
      description: 说明期望交互、输入、输出和可验证的完成条件。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围与兼容性
      description: 是否影响 Windows 版本、模拟器、ADB、IPC、配置或现有流程？
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索已有 Issue。
          required: true
        - label: 建议不要求复制 OnmyojiAutoScript 的 GPLv3 代码、游戏素材或识别模板。
          required: true
