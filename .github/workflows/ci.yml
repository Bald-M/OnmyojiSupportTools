name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'const title = process.env.PR_TITLE ?? ""; const conventional = /^(feat|fix|docs|refactor|perf|test|build|ci|chore)(\([a-z0-9-]+\))?!?: .+/; if (!conventional.test(title)) { console.error(`Invalid PR title: ${title}`); process.exit(1); }'

  quality:
    name: Quality · Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          architecture: x64

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm check

      - name: Build frontend
        run: pnpm frontend:build

  build-windows:
    name: Build · ${{ matrix.platform }} ${{ matrix.arch }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
          - platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify Windows bundle
        id: package
        shell: pwsh
        run: pnpm build:windows:${{ matrix.arch }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: OnmyojiSupportTools-0.1.0-${{ matrix.platform }}-${{ matrix.arch }}-nsis
          path: ${{ steps.package.outputs.installer_path }}
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OnmyojiSupportTools-0.1.0-${{ matrix.platform }}-${{ matrix.arch }}-portable
          path: ${{ steps.package.outputs.portable_zip_path }}
          if-no-files-found: error
