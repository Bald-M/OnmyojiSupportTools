[package]
name = "onmyoji-support-tools"
version = "0.1.0"
description = "Windows-first Android emulator support tools"
authors = ["Bald-M"]
license = "MIT"
repository = "https://github.com/Bald-M/OnmyojiSupportTools"
edition = "2024"

[lib]
name = "onmyoji_support_tools"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
async-trait = "0.1.92"
prost = "0.14.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.23.0"
